      function __resizeIframe(obj) {
        var scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          var element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          var hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          var newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "ed803f883f43e3d8a9329de90b19b149", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "71c50e5945f12efc8369c4692e2f6d8d", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"sizing-a-geo-lift-test-of-paid-social\"\u003ESizing a geo-lift test of paid social\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EEvery number behind the geo-lift test plan, derived step by step from the Merchandise Store's weekly orders by region.\nSections 1 to 4 explore the data and need no test decisions; each set of controls sits right above the sections\nthat use it.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6c9673521dfbd549a27e6862135f7b79", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ESection\u003C/th\u003E\n\u003Cth\u003EDerives\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E0. Data\u003C/td\u003E\n\u003Ctd\u003EWeekly orders, revenue and buyers by region, live from BigQuery\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E1. Regions in scope\u003C/td\u003E\n\u003Ctd\u003EWhich regions count, and which are left out\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E2. What the data shows\u003C/td\u003E\n\u003Ctd\u003EOrders a week, sales a year, sales a day per group\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E3. Chance and clumping\u003C/td\u003E\n\u003Ctd\u003EPoisson check; clumping (\u2248 1.3)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E4. Regional swing\u003C/td\u003E\n\u003Ctd\u003EA region's own swing (\u2248 34%) and its persistence (\u2248 0.24), with ranges\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E5. Regions and split\u003C/td\u003E\n\u003Ctd\u003EFake-region sizes, the size cap, pairing and coin flip\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E5b. Detectable lift and spend cap\u003C/td\u003E\n\u003Ctd\u003ESmallest detectable lift by length (with 95% ranges), and the most ad spend that breaks even at it\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E6. Reading the chosen test\u003C/td\u003E\n\u003Ctd\u003EThe bar for a real lift, outcomes by true lift, and how to read a result\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b63b36e233eab7143351e1fe0599f89f", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"0-data-live-from-bigquery\"\u003E0. Data: live from BigQuery\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "da69d4f5fd59a2136edb21a819a714d8", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe query reads the public \u003Ccode\u003Ebigquery-public-data.google_analytics_sample\u003C/code\u003E dataset and is billed to your project (well within BigQuery's free monthly allowance). Without a project, the notebook loads the saved extract \u003Ccode\u003Edata/q17_geo_lift_panel.csv\u003C/code\u003E. Results are cached in \u003Ccode\u003E.cache/\u003C/code\u003E, under a name made from the query text: the same query is never run twice, and editing the query fetches fresh data. Moving controls never re-runs the query. Sign in once in a terminal: \u003Ccode\u003Egcloud auth application-default login\u003C/code\u003E.\u003  flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='SFPL-0' random-id='cbdc128b-177e-5d33-0227-ad104c9b5437'\u003E\u003Cmarimo-number data-initial-value='40' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Orders a year to count as its own metro\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-start='0' data-stop='1000' data-step='10' data-debounce='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-number\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='SFPL-1' random-id='0d517297-e75f-4851-958a-036361e961ff'\u003E\u003Cmarimo-number data-initial-value='7' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Random seed\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-start='0' data-stop='10000' data-step='1' data-debounce='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-number\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "87a0748109a784e6724f53ef7fa3ac9a", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "18db1b289930bdfc66684344ab93596c", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='RGSE-0' random-id='dfcf5032-d775-7d11-f895-007111399a4c'\u003E\u003Cmarimo-multiselect data-initial-value='[\u0026quot;San Francisco-Oakland-San Jose CA\u0026quo ncoding\u0026#92;\u0026quot;: {\u0026#92;n    \u0026#92;\u0026quot;x\u0026#92;\u0026quot;: {\u0026#92;n      \u0026#92;\u0026quot;field\u0026#92;\u0026quot;: \u0026#92;\u0026quot;orders\u0026#92;\u0026quot;,\u0026#92;n      \u0026#92;\u0026quot;type\u0026#92;\u0026quot;: \u0026#92;\u0026quot;quantitative\u0026#92;\u0026quot;\u0026#92;n    },\u0026#92;n    \u0026#92;\u0026quot;y\u0026#92;\u0026quot;: {\u0026#92;n      \u0026#92;\u0026quot;field\u0026#92;\u0026quot;: \u0026#92;\u0026quot;weeks\u0026#92;\u0026quot;,\u0026#92;n      \u0026#92;\u0026quot;type\u0026#92;\u0026quot;: \u0026#92;\u0026quot;quantitative\u0026#92;\u0026quot;\u0026#92;n    }\u0026#92;n  },\u0026#92;n  \u0026#92;\u0026quot;height\u0026#92;\u0026quot;: 180,\u0026#92;n  \u0026#92;\u0026quot;mark\u0026#92;\u0026quot;: {\u0026#92;n    \u0026#92;\u0026quot;type\u0026#92;\u0026quot;: \u0026#92;\u0026quot;bar\u0026#92;\u0026quot;\u0026#92;n  },\u0026#92;n  \u0026#92;\u0026quot;usermeta\u0026#92;\u0026quot;: {\u0026#92;n    \u0026#92;\u0026quot;embedOptions\u0026#92;\u0026quot;: {}\u0026#92;n  },\u0026#92;n  \u0026#92;\u0026quot;width\u0026#92;\u0026quot;: 420\u0026#92;n}\u0026quot;'\u003E\u003C/marimo-mime-renderer\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E100,000 simulated weeks:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Eaverage \u003Cstrong\u003E11.29\u003C/strong\u003E\u003C/li\u003E\n\u003Cli\u003Evariance \u003Cstrong\u003E11.25\u003C/strong\u003E\u003C/li\u003E\n\u003Cli\u003Etypical variation \u221avariance = \u003Cstrong\u003E\u00b13.35\u003C/strong\u003E (\u221a\u03bb = 3.36)\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "41cb0cd92b7d6cbffd90012e4aff189f", "console": [], "id": "ROlb", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "54672bc64c205c47f931373fda5ebdc5", "console": [], "id": "qnkX", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EClumping in the real data.\u003C/strong\u003E For each single metro and each week, all from the real orders:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EWeek index\u003C/strong\u003E = total orders that week in all \u003Cem\u003Eother\u003C/em\u003E regions (Venezuela left out) \u00f7 their average weekly\n   total over the 52 weeks. 1.2 means the rest of the store was 20% busier than usual that week.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EExpected orders\u003C/strong\u003E = the metro's average weekly orders over the 52 weeks \u00d7 the week index.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EVariance \u00f7 average\u003C/strong\u003E = \u03a3 (actual \u2212 expected)\u00b2 \u00f7 \u03a3 expected, over the 52 weeks, \u00d7 52/51.\n   The expected values add up to the actual total, so the denominator is also the metro's actual average \u00d7 52.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EPure chance gives about 1. Orders per buyer (total orders \u00f7 total weekly buyers) above 1 shows why it is higher:\none buyer often places several orders.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EClumping, in business terms.\u003C/strong\u003E Pure chance assumes every order is an independent purchase: a separate customer\ndeciding on their own. In practice one decision often produces several orders: a customer splits a purchase,\ncomes back for a second item, or buys for a team or event. Those orders arrive together, so weekly counts jump\nin bunches instead of one at a time, and vary more than independent purchases would.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe clumping number (about 1.3) is \u003Cstrong\u003Enot\u003C/strong\u003E any one metro's ratio below, nor their average. Each metro's ratio\nmixes clumping, which is the same everywhere, with the metro's own swing, which grows with its size. Section 4\nseparates them: clumping is the ratio a metro would have if it were too small for its swing to matter, and it\nmeans weekly variance is about 1.3 times what independent purchases would give.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EReading the ratio.\u003C/strong\u003E Even if purchases were independent, a metro's ratio would not be exactly 1 in a single\nyear. The column \u003Cem\u003E95% range if purchases independent\u003C/em\u003E shows where it would fall 95% of the time: 5,000 simulated years of\nindependent (Poisson) orders around the metro's own weekly expected values, scored the same way. It comes out\nat about 0.64 to 1.47 for every metro: with 52 weeks, a ratio's chance spread barely depends on size. With 11\nmetros, about one in 20 would fall outside it by chance alone, so a value just past the edge is weak evidence.\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EVerdict\u003C/th\u003E\n\u003Cth\u003EWhat it indicates\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003Ewithin\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EThe metro's weekly ups and downs are no larger than independent purchases would give: each order looks like a separate customer's decision, and the metro has no clear busy or quiet spells of its own\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003Eabove\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EMore variation than independent purchases: orders arrive in bunches (one buyer placing several; see orders per buyer), the metro has busy and quiet spells of its own, or both. Section 4 separates the two. These metros add the most noise to the test\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003Ebelow\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003ELess variation than independent purchases: orders more regular than chance, as with subscriptions, scheduled reorders or capped stock. Poisson would not describe the metro, and the noise model would overstate its noise\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='qnkX-0' random-id='8f16e109-47f1-bd44-498a-e10e4b5ea2ed'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;metro\u0026#92;\u0026quot;:\u0026#92;\u0026quot;San Francisco-Oakland-San Jose CA\u0026#92;\u0026quot;,\u0026#92;\u0026quot;average orders a week\u0026#92;\u0026quot;:21.3,\u0026#92;\u0026quot;variance \u0026#92;\u0026#92;u00f7 average\u0026#92;\u0026quot;:3.37,\u0026#92;\u0026quot;95% range if purchases independent\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.64 \u0026#92;\u0026#92;u2013 1.43\u0026#92;\u0026quot;,\u0026#92;\u0026quot;verdict\u0026#92;\u0026quot;:\u0026#92;\u0026quot;above\u0026#92;\u0026quot;,\u0026#92;\u0026quot;orders per buyer\u0026#92;\u0026quot;:1.08},{\u0026#92;\u0026quot;metro\u0026#92;\u0026quot;:\u0026#92;\u0026quot;New York NY\u0026#92;\u0026quot;,\u0026#92;\u0026quot;average orders a week\u0026#92;\u0026quot;:11.3,\u0026#92;\u0026quot;variance \u0026#92;\u0026#92;u00f7 average\u0026#92;\u0026quot;:4.35,\u0026#92;\u0026quot;95% range if purchases independent\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.64 \u0026#92;\u0026#92;u2013 1.46\u0026#92;\u0026quot;,\u0026#92;\u0026quot;verdict\u0026#92;\u0026quot;:\u0026#92;\u0026quot;above\u0026#92;\u0026quot;,\u0026#92;\u0026quot;orders per buyer\u0026#92;\u0026quot;:1.11},{\u0026#92;\u0026quot;metro\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Chicago IL\u0026#92;\u0026quot;,\u0026#92;\u0026quot;average orders a week\u0026#92;\u0026quot;:3.9,\u0026#92;\u0026quot;variance \u0026#92;\u0026#92;u00f7 a u0026#92;\u0026quot;:0.9,\u0026#92;\u0026quot;variance \u0026#92;\u0026#92;u00f7 average\u0026#92;\u0026quot;:1.18,\u0026#92;\u0026quot;95% range if purchases independent\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.66 \u0026#92;\u0026#92;u2013 1.45\u0026#92;\u0026quot;,\u0026#92;\u0026quot;verdict\u0026#92;\u0026quot;:\u0026#92;\u0026quot;within\u0026#92;\u0026quot;,\u0026#92;\u0026quot;orders per buyer\u0026#92;\u0026quot;:1.0},{\u0026#92;\u0026quot;metro\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Washington DC (Hagerstown MD)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;average orders a week\u0026#92;\u0026quot;:0.8,\u0026#92;\u0026quot;variance \u0026#92;\u0026#92;u00f7 average\u0026#92;\u0026quot;:1.47,\u0026#92;\u0026quot;95% range if purchases independent\u0026#92;\u0026quot;:\u0026#92;\u0026quot;0.66 \u0026#92;\u0026#92;u2013 1.46\u0026#92;\u0026quot;,\u0026#92;\u0026quot;verdict\u0026#92;\u0026quot;:\u0026#92;\u0026quot;above\u0026#92;\u0026quot;,\u0026#92;\u0026quot;orders per buyer\u0026#92;\u0026quot;:1.05}]\u0026quot;' data-total-rows='11' data-total-columns='6' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='15' data-field-types='[[\u0026quot;metro\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;average orders a week\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;variance \u00f7 average\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;95% range if purchases independent\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;verdict\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;orders per buyer\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-column-summaries='true' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "df9e67eebd50bff799525c48df31267e", "console": [], "id": "TqIu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"4-regional-swing\"\u003E4. Regional swing\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EUnder the noise model, \u003Cstrong\u003Evariance \u00f7 average = clumping + swing\u00b2 \u00d7 average\u003C/strong\u003E: clumping lifts every metro's\nratio by the same amount; a region's own swing lifts it more the bigger the metro. Fitting this line\n(weighted, so metros with more data count more) gives both numbers.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EPersistence\u003C/strong\u003E is fitted separately, on the metros with at least 2 orders a week: multiply each week's leftover\n(actual \u2212 expected orders) by the next week's, add up, divide by the matching sum of expected orders (this week\n\u00d7 next week), then by swing\u00b2. Chance and clumping don't carry from week to week, so this picks up only the swing.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ERanges come from rebuilding the year from random 4-week blocks (to keep\nruns of busy or quiet weeks together), refitting each time, and taking the middle share of the results:\nfor a 95% range, the 2.5th to 97.5th percentiles.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4e762d5e639ea59d2b99707ac4252d22", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='Vxnm-0' random-id='fbe01dde-3bac-7a70-7248-bb84d8ebb79c'\u003E\u003 n-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "acbeac9e5608ff3c50f3a2770687ac61", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"the-noise-model-and-its-basis\"\u003EThe noise model and its basis\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EFor region \u003Cmarimo-tex class=\"arithmatex\"\u003E||(r||)\u003C/marimo-tex\u003E in week \u003Cmarimo-tex class=\"arithmatex\"\u003E||(t||)\u003C/marimo-tex\u003E, with expected orders \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\mu_{rt}||)\u003C/marimo-tex\u003E = the region's average \u00d7 the week index:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\text{orders}_{rt} \\sim \\text{clumped Poisson}\\big(\\mu_{rt}\\, g_{rt}\\big), \\qquad\ng_{rt} = e^{\\sigma z_{rt} - \\sigma^2/2}, \\qquad z_{rt} = \\rho\\, z_{r,t-1} + \\sqrt{1-\\rho^2}\\,\\varepsilon_{rt}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThis gives two moment equations, which are what Sections 3 and 4 fit:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EEquation\u003C/th\u003E\n\u003Cth\u003EFits\u003C/th\u003E\n\u003Cth\u003EMeaning\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{Var}(\\text{orders}_{rt}) = \\varphi\\,\\mu_{rt} + \\sigma^2 \\mu_{rt}^2||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd\u003EClumping \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\varphi||)\u003C/marimo-tex\u003E, swing \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sigma||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd\u003EOne week's spread: chance with clumping, plus the region's own swing\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{Cov}(\\text{orders}_{rt}, \\text{orders}_{r,t+k}) = \\rho^k \\sigma^2 \\mu_{rt}\\, \\mu_{r,t+k}||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd\u003EPersistence \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rho||)\u003C/marimo-tex\u003E (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(k = 1||)\u003C/marimo-tex\u003E)\u003C/td\u003E\n\u003Ctd\u003EOnly the swing carries between weeks, fading by \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\rho||)\u003C/marimo-tex\u003E each week\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EPiece\u003C/th\u003E\n\u003Cth\u003EBasis\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ECounts around a hidden level that carries week to week, fitted from the leftovers' squares and products\u003C/td\u003E\n\u003Ctd\u003EZeger (1988), \u003Cem\u003EA regression model for time series of counts\u003C/em\u003E, Biometrika 75(4): the same two equations and moment estimates (with \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\varphi = 1||)\u003C/marimo-tex\u003E)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EVariance above Poisson (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\varphi\\mu||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sigma^2\\mu^2||)\u003C/marimo-tex\u003E terms)\u003C/td\u003E\n\u003Ctd\u003EOverdispersed count models: quasi-Poisson and negative binomial (McCullagh \u0026amp; Nelder, \u003Cem\u003EGeneralized Linear Models\u003C/em\u003E, 1989)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EClumping: one decision, several orders\u003C/td\u003E\n\u003Ctd\u003ECompound Poisson process\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EExpected = region average \u00d7 week index\u003C/td\u003E\n\u003Ctd\u003EMultiplicative region \u00d7 week model, leaving each region out of its own index\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ERanges from rebuilding the year in 4-week blocks\u003C/td\u003E\n\u003Ctd\u003EMoving block bootstrap: K\u00fcnsch (1989), \u003Cem\u003EAnnals of Statistics\u003C/em\u003E 17(3)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EDetectable lift from fake tests\u003C/td\u003E\n\u003Ctd\u003EPower analysis by simulation\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EPublished geo-test tools (GeoLift, matched_markets, trimmed_match) size tests by replaying the real regions'\nhistory instead of fitting a noise model. Here that replay is the \"Scaled by real data\" check in Section 5b, because the public data\nhas one year and hides the metro for most orders.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5b1c610c3b0a0472ee471c0c2907676a", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"5-regions-and-split-the-fake-regions\"\u003E5. Regions and split: the fake regions\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EFake regions are made-up regions with no names, only sizes, whose weekly orders vary like the real\ndata (clumping, swing, persistence). Sizes fall off from large to small the way the real metros'\ndo (a power law fitted to the single US metros in the test) and add up to the real total. Any region over\nthe cap is split, as a large metro would be split into postal-code areas. Regions are paired by size and a\ncoin flip in each pair picks the campaign region.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d43f3ecd96040f58405e58226408f253", "console": [], "id": "aLJB", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EControl\u003C/th\u003E\n\u003Cth\u003EBusiness meaning\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003ELargest region, share of orders\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EKeeps any single market from deciding the result. Lower means splitting more big metros into postal-code areas\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EFake regions before splitting\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EHow many markets the store can run the test in. More markets give a more precise test\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='aLJB-0' random-id='b00e43d2-6006-e328-8cf2-1ddcfff59e8f'\u003E\u003Cmarimo-slider data-initial-value='0.1' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Largest region, share of orders\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-start='0.05' data-stop='0.5' data-step='0.01' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='aLJB-1' random-id='12fd0b6d-2158-eb1e-0e10-0d227356bd94'\u003E\u003Cmarimo-slider data-initial-value='24' data-label='\u0026quot;\u0026lt;span class=\u0026#92 ncoding\u0026quot;:{\u0026quot;color\u0026quot;:{\u0026quot;field\u0026quot;:\u0026quot;group\u0026quot;,\u0026quot;type\u0026quot;:\u0026quot;nominal\u0026quot;},\u0026quot;tooltip\u0026quot;:[{\u0026quot;field\u0026quot;:\u0026quot;region\u0026quot;,\u0026quot;type\u0026quot;:\u0026quot;quantitative\u0026quot;},{\u0026quot;field\u0026quot;:\u0026quot;orders_a_week\u0026quot;,\u0026quot;type\u0026quot;:\u0026quot;quantitative\u0026quot;},{\u0026quot;field\u0026quot;:\u0026quot;group\u0026quot;,\u0026quot;type\u0026quot;:\u0026quot;nominal\u0026quot;}],\u0026quot;x\u0026quot;:{\u0026quot;field\u0026quot;:\u0026quot;region\u0026quot;,\u0026quot;type\u0026quot;:\u0026quot;ordinal\u0026quot;},\u0026quot;y\u0026quot;:{\u0026quot;field\u0026quot;:\u0026quot;orders_a_week\u0026quot;,\u0026quot;type\u0026quot;:\u0026quot;quantitative\u0026quot;}},\u0026quot;height\u0026quot;:220,\u0026quot;width\u0026quot;:\u0026quot;container\u0026quot;,\u0026quot;\u0026#36;schema\u0026quot;:\u0026quot;https://vega.github.io/schema/vega-lite/v6.1.0.json\u0026quot;}' data-chart-selection='true' data-field-selection='true'\u003E\u003C/marimo-vega\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhy 28 regions.\u003C/strong\u003E The starting count (24, set by the \u003Cem\u003Efake regions before splitting\u003C/em\u003E\ncontrol) is a working assumption, not taken from the data: the public data names only a few single metros and\nhides the metro for most orders, so it can't say how many markets the store has. The default follows the plan's\nworking figure of about 20 metros plus a few outside the US. Splitting every region over the\n10% cap then gives 28. The count matters: each region's swing averages out only across\nregions, so fewer regions mean a larger detectable lift. Replace it with the store's own count of targetable\nmarkets once orders can be located by shipping address.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "923f94cfc410d67f76d33dcbd964d73c", "console": [], "id": "AjVT", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e6ee1108c2b1aff69951fc0d8cc09a8e", "console": [], "id": "pHFh", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"5b-detectable-lift-and-spend-cap\"\u003E5b. Detectable lift and spend cap\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EControl\u003C/th\u003E\n\u003Cth\u003EBusiness meaning\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EGross margin\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EShare of each sales dollar kept as profit. Sets break-even: each ad dollar must bring 1 \u00f7 margin of extra sales ($2 at 50%)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EPower\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EChance the test catches a lift of the stated size. 80% means it misses 1 in 5\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EFalse-alarm rate\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EChance of seeing a \"lift\" when the ads did nothing, and so scaling a campaign that doesn't work\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003ETest: two-sided / one-sided\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003ETwo-sided also guards against misreading a harmful campaign; one-sided only asks \"is it worth scaling?\" and needs a smaller test\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EWeeks of follow-up\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003EHow long to keep counting after the ads stop, to catch later purchases. Delays the answer; costs no ad spend\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EFake tests per setting\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd\u003ETechnical: how precisely the notebook estimates\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='pHFh-0' random-id='ce81e7a2-e0e6-d2aa-7115-d899ae7fc64c'\u003E\u003Cmarimo-slider data-initial-value='0.5' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Gross margin\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-start='0.2' data-stop='0.8' data-step='0.05' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='pHFh-1' random-id='a5b931a4-1fee-54a7-a255-99bae54ef90a'\u003E\u003Cmarimo-slider data-initial-value='0.8' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Power\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-start='0.5' data-stop='0.95' data-step='0.05' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E\u003Cdiv style='display: uot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E\u003Cmarimo-ui-element object-id='pHFh-5' random-id='d97d00b2-031d-dbf7-066f-c2a0ca8cda9f'\u003E\u003Cmarimo-slider data-initial-value='1500' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Fake tests per setting\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-start='200' data-stop='3000' data-step='100' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "cd58a0b5f2fe4e408f72bc2cac4fc4f9", "console": [], "id": "NCOB", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8326dfb5080bd3ce550cf1be07102458", "console": [], "id": "aqbW", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f3bbb90e8eacf5e3383fe608a2aa20c7", "console": [], "id": "TRpd", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"smallest-detectable-lift-by-length\"\u003ESmallest detectable lift by length\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EFor each length of ads (plus the follow-up weeks), two estimates of the smallest lift detected with the chosen\npower:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EModel only:\u003C/strong\u003E fake tests on the planned regions (Section 5) with the fitted clumping, swing and persistence.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EScaled by real data:\u003C/strong\u003E the same, with the noise multiplied by (real \u00f7 model noise) measured on the real regions\n  at the same length. \u003Cem\u003EReal noise:\u003C/em\u003E fake tests replayed on the real regions' own weeks: random pairings, every window\n  in the year with at least 13 weeks of history before it, no change made. \u003Cem\u003EModel noise:\u003C/em\u003E the model on regions of\n  exactly those sizes. Only lengths that fit in one year can be checked.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ESmallest detectable lift = e^((critical z + power z) \u00d7 noise) \u2212 1. \u003Cstrong\u003E95% ranges:\u003C/strong\u003E the year is rebuilt from random\n4-week blocks many times; each time the three numbers are refitted, the model re-simulated and the real data\nreplayed, and the middle 95% of the results is kept.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7f0c3696c20602fd84f7369878bd58ec", "console": [], "id": "TXez", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='TXez-0' random-id='3d5480b3-b9d9-c881-12d6-5ae63c9d5cf0'\u003E\u003Cmarimo-slider data-initial-value='20' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Rebuilt years for the 95% ranges\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-start='20' data-stop='300' data-step='20' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='true' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='TXez-1' random-id='a7579992-5d74-1137-e443-bb466cf1be82'\u003E\u003Cmarimo-button data-initial-value='0 ema\u0026quot;:\u0026quot;https://vega.github.io/schema/vega-lite/v6.1.0.json\u0026quot;}' data-chart-selection='true' data-field-selection='true'\u003E\u003C/marimo-vega\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EHow sure are these numbers?\u003C/strong\u003E Lines are the best estimates; shaded bands show how much they could move.\nWe have only one year of sales, so to see how different another year might look, we build 20 \"rebuilt years\"\nby re-picking the real year's sales a month (4 weeks) at a time: some months get picked twice, others not at all.\nThe calculation is redone for each alternative year, and the band covers the middle 95% of the answers.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EBlue, model only:\u003C/strong\u003E how much the estimate moves when the sales noise is re-measured in each alternative year.\n  It doesn't cover the model itself being off (Section 4).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EOrange, scaled by real data:\u003C/strong\u003E a rough guide only. Re-picking months scrambles the order of the year, which this\n  line depends on, so its band is probably wider than the real uncertainty. It stops at the longest test that,\n  with enough weeks before it to compare against, still fits inside one year of data.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "458112f645ec292edd00bff6fad6ba41", "console": [], "id": "wlCL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhy the two lines differ, and which to trust\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWeek by week, the real data is about as noisy as the model. But the test compares totals over the whole window, and\nthere the real regions are steadier: a busy week tends to be followed by quieter ones, while the model lets busy\nspells add up, and gives every region New York's large swings.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe orange line may be too optimistic:\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EOne year.\u003C/strong\u003E The rebuilt years only re-pick months from the same 52 real weeks. They show how much the result\n  moves within this year, not how a different year with its own events (a worse holiday season, a long regional\n  slump) would behave; such a year could be noisier.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EOverlapping replays.\u003C/strong\u003E They share most of their weeks, so they understate how much results could vary.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EShorter comparison periods.\u003C/strong\u003E Inside one year, each replay can compare against only 13 to 38 weeks before the\n  test, not the full year the real test would have.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EA possible artefact.\u003C/strong\u003E Expected orders come from the other regions' totals; in a small store a region's busy week\n  also nudges that total, which can make its ups and downs look like they cancel.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFew regions.\u003C/strong\u003E Only the 13 regions with a known location can be replayed, without most of the orders.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIs the blue line an upper limit?\u003C/strong\u003E Probably on the high side, but not guaranteed. It was built to be cautious\n(one large swing for every region, plus carry-over), yet it can only reflect what one year shows: a worse year,\nmonth-long regional shocks or a different holiday season could make the real test noisier still.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ERule of thumb for more data.\u003C/strong\u003E This study rests on 52 weeks. To replay a test properly you need a full year to\ncompare against plus the test window itself, repeated several times:\n\u003Cem\u003Eweeks of history needed \u2248 52 + (number of independent replays \u00d7 test window)\u003C/em\u003E. For a 13-week test (17-week\nwindow) and about 6 independent replays: 52 + 6 \u00d7 17 \u2248 154 weeks, \u003Cstrong\u003Eabout 3 years\u003C/strong\u003E. Two years is the minimum\nto replay even one full-length test against a full year. The uncertainty in the fitted swing shrinks roughly with\nthe square root of the years of data, so 4 years would about halve today's range.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7d331d27d2f57b222acd50227f3bb78e", "console": [], "id": "kqZH", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"most-ad-spend-that-breaks-even-by-length\"\u003EMost ad spend that breaks even, by length\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EIf the ads lift the campaign group's sales by exactly the smallest detectable lift, the extra sales over the window\nare lift \u00d7 the group's normal sales. At the gross margin, those extra sales bring\n\u003Cstrong\u003Egross profit = margin \u00d7 lift \u00d7 normal sales\u003C/strong\u003E. That is the most the ads can cost and still break even, the\n\u003Cstrong\u003Espend cap\u003C/strong\u003E. Spend below it and a campaign at that lift makes money; above it, it loses money.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0f80ec1d3bad8b24792ba079ad4cac78", "console": [], "id": "wAgl", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='wAgl-0' random-id='2978843e-aa28-94ca-06be-18e3a873f603'\u003E\u003Cmarimo-table data-initial-value='[] day; range \u0026#36;11,613\u0026#92;\u0026#92;u2013\u0026#36;29,609)\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;weeks of ads\u0026#92;\u0026quot;:20,\u0026#92;\u0026quot;normal sales over the window\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;211,120\u0026#92;\u0026quot;,\u0026#92;\u0026quot;lift, model only\u0026#92;\u0026quot;:\u0026#92;\u0026quot;23% (18%\u0026#92;\u0026#92;u201333%)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;spend cap, model only\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;24,726 (\u0026#36;177/day)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;lift, scaled\u0026#92;\u0026quot;:\u0026#92;\u0026quot;12% (10%\u0026#92;\u0026#92;u201327%)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;spend cap, scaled\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;13,177 (\u0026#36;94/day; range \u0026#36;10,994\u0026#92;\u0026#92;u2013\u0026#36;28,127)\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;weeks of ads\u0026#92;\u0026quot;:26,\u0026#92;\u0026quot;normal sales over the window\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;263,900\u0026#92;\u0026quot;,\u0026#92;\u0026quot;lift, model only\u0026#92;\u0026quot;:\u0026#92;\u0026quot;22% (17%\u0026#92;\u0026#92;u201328%)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;spend cap, model only\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;28,764 (\u0026#36;158/day)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;lift, scaled\u0026#92;\u0026quot;:\u0026#92;\u0026quot;8% (8%\u0026#92;\u0026#92;u201330%)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;spend cap, scaled\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;10,829 (\u0026#36;59/day; range \u0026#36;10,731\u0026#92;\u0026#92;u2013\u0026#36;40,039)\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;weeks of ads\u0026#92;\u0026quot;:39,\u0026#92;\u0026quot;normal sales over the window\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;378,256\u0026#92;\u0026quot;,\u0026#92;\u0026quot;lift, model only\u0026#92;\u0026quot;:\u0026#92;\u0026quot;19% (13%\u0026#92;\u0026#92;u201329%)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;spend cap, model only\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;36,710 (\u0026#36;134/day)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;lift, scaled\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u2014\u0026#92;\u0026quot;,\u0026#92;\u0026quot;spend cap, scaled\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u2014\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;weeks of ads\u0026#92;\u0026quot;:52,\u0026#92;\u0026quot;normal sales over the window\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;492,612\u0026#92;\u0026quot;,\u0026#92;\u0026quot;lift, model only\u0026#92;\u0026quot;:\u0026#92;\u0026quot;18% (14%\u0026#92;\u0026#92;u201327%)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;spend cap, model only\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#36;43,570 (\u0026#36;120/day)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;lift, scaled\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u2014\u0026#92;\u0026quot;,\u0026#92;\u0026quot;spend cap, scaled\u0026#92;\u0026quot;:\u0026#92;\u0026quot;\u0026#92;\u0026#92;u2014\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='9' data-total-columns='6' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='15' data-field-types='[[\u0026quot;weeks of ads\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]],[\u0026quot;normal sales over the window\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;lift, model only\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;spend cap, model only\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;lift, scaled\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]],[\u0026quot;spend cap, scaled\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;object\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENormal sales over the window = campaign group's average sales a day ($1,257: all test regions' $2,513 \u00d7 50%) \u00d7 7 \u00d7 (ads weeks + 4 follow-up weeks). Spend cap = 50% \u00d7 lift \u00d7 normal sales; per day = cap \u00f7 (7 \u00d7 ads weeks).\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "ce7594657c5c99e8c64a6fbbf6a28713", "console": [], "id": "rEll", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ECarry one length into Section 6,\u003C/strong\u003E which shows the bar for a real lift and the outcomes by true lift.\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='rEll-0' random-id='f68df88e-3a91-f50a-963f-fe1b30660dc0'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;13\u0026quot;]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Weeks of ads to examine below\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-options='[\u0026quot;2\u0026quot;,\u0026quot;4\u0026quot;,\u0026quot;8\u0026quot;,\u0026quot;13\u0026quot;,\u0026quot;16\u0026quot;,\u0026quot;20\u0026quot;,\u0026quot;26\u0026quot;,\u0026quot;39\u0026quot;,\u0026quot;52\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='rEll-1' random-id='58a01dbe-f1ea-39f6-f19b-6f60190421d7'\u003E\u003Cmarimo-radio data-initial-value='\u0026quot;Model only\u0026quot;' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Noise basis\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-options='[\u0026quot;Model only\u0026quot;,\u0026quot;Scaled by real data\u0026quot;]' data-inline='false' data-disabled='false'\u003E\u003C/marimo-radio\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "f660615dc141426108cb0eb275a2153b", "console": [], "id": "dGlV", "outputs": [{"data": {"text/html": "\u003Cmarimo-callout-output data-html='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;h3 id=\u0026#92;\u0026quot;13-weeks-of-ads-4-of-follow-up-smallest-detectable-lift-27-model-only-spend-cap-225-a-day-20498-in-total\u0026#92;\u0026quot;\u0026gt;13 weeks of ads + 4 of follow-up \u00b7 smallest detectable lift 27% (model only) \u00b7 spend cap \u0026#36;225 a day, \u0026#36;20,498 in total\u0026lt;/h3\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-kind='\u0026quot;success\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}, {"code_hash": "8148e3ffd7e0e0b8b4905ec6d133eeaa", "console": [], "id": "SdmI", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"6-reading-the-chosen-test\"\u003E6. Reading the chosen test\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EQuestion: did the ads do anything?\u003C/strong\u003E Null hypothesis: lift = 0. Test: 13 weeks of ads + 4 of\nfollow-up, spend cap $20,498; noise = ln(1 + 27.4%) \u00f7 (1.96 + 0.84) = 8.6%.\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EObserved lift\u003C/th\u003E\n\u003Cth\u003EReading\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EBelow \u003Cstrong\u003E18%\u003C/strong\u003E (the bar = 1.96 \u00d7 noise)\u003C/td\u003E\n\u003Ctd\u003ENo evidence the ads did anything. With no real effect, a lift above the bar happens 2.5% of the time (the 5% false-alarm rate, upper side only)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003E18%\u003C/strong\u003E or more\u003C/td\u003E\n\u003Ctd\u003EThe ads did something. The observed lift is the best estimate of the true lift: at the spend cap, 27% or more pays back\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ETrue lift\u003C/th\u003E\n\u003Cth\u003EIf the true lift is this, chance the test detects it\u003C/th\u003E\n\u003Cth\u003EProfit at the spend cap\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E0% (no effect)\u003C/td\u003E\n\u003Ctd\u003E3%\u003C/td\u003E\n\u003Ctd\u003E\u2212$20,498\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E14% (half)\u003C/td\u003E\n\u003Ctd\u003E32%\u003C/td\u003E\n\u003Ctd\u003E\u2212$10,249\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E27% (smallest detectable)\u003C/td\u003E\n\u003Ctd\u003E80%\u003C/td\u003E\n\u003Ctd\u003E$0\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E41% (1.5 \u00d7)\u003C/td\u003E\n\u003Ctd\u003E98%\u003C/td\u003E\n\u003Ctd\u003E+$10,249\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E55% (double)\u003C/td\u003E\n\u003Ctd\u003E100%\u003C/td\u003E\n\u003Ctd\u003E+$20,498\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EReading the chance.\u003C/strong\u003E Suppose the ads truly raise sales by the lift in the first column. Weekly sales bounce\naround, so the lift the test measures comes out somewhat higher or lower than the truth. The chance is how often it\ncomes out at or above the bar (18%), so the test reports that the ads worked. Bigger true lifts are caught\nmore often; the smallest detectable lift (27%) is where the chance reaches 80%. It is \u003Cem\u003Enot\u003C/em\u003E\nthe chance that a reported lift is real: that also depends on how likely the ads were to work in the first place.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EProfit = 50% margin \u00d7 true lift \u00d7 normal sales over the window ($149,543) \u2212 spend cap, before\ncontent costs. Confirming payback, rather than any lift, would need a stricter test against lift = 27%.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.17.6"}, "version": "1"},
            "runtimeConfig": null,
        };
    </script>
